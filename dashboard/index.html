<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History Dashboard</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" type="module"></script>
  </head>
  <body>
    <main class="dashboard">
      <history-calendar id="calendar" role="complementary" aria-label="选择日期范围"></history-calendar>

      <section class="content" aria-label="所选日期范围的历史记录">
        <history-toolbar></history-toolbar>

        <history-list></history-list>
        <history-week></history-week>
        <history-month></history-month>
      </section>
    </main>
  </body>
</html>
