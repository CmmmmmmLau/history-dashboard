<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History Dashboard</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" type="module"></script>
  </head>
  <body>
    <main class="dashboard">
      <hd-calendar id="calendar" role="complementary" aria-label="选择日期范围"></hd-calendar>

      <section class="content" aria-label="所选日期范围的历史记录">
        <hd-toolbar></hd-toolbar>

        <hd-list></hd-list>
        <hd-week></hd-week>
        <hd-month></hd-month>
      </section>
    </main>
  </body>
</html>
