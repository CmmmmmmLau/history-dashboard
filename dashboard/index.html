<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History Dashboard</title>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" type="module"></script>
  </head>
  <body>
    <main class="dashboard">
      <history-calendar id="calendar" role="complementary" aria-label="选择日期范围"></history-calendar>

      <section class="content" aria-label="所选日期范围的历史记录">
        <header class="content-toolbar">
          <div class="search-area">
            <button id="toggle-calendar" type="button" aria-controls="calendar" aria-expanded="true" aria-label="隐藏日历" title="隐藏日历"></button>
            <label class="sr-only" for="search">搜索所选范围的记录</label>
            <input id="search" type="search" placeholder="搜索所选范围的标题或网址" autocomplete="off" />
          </div>
          <div class="heading">
            <h1 id="selected-date"></h1>
            <span id="count" aria-live="polite"></span>
          </div>
          <div class="actions">
            <button id="refresh" type="button">刷新</button>
          </div>
        </header>

        <history-list></history-list>
      </section>
    </main>
  </body>
</html>
